<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthdays</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Birthdays">
<style>
:root{--bg:#f5f8f6;--card:#fff;--ink:#1f2a33;--mute:#6b7a86;--line:#e3ebe7;--acc:#0e9aa7;--accbg:#dff3f4;--chip:#eef3f1;--sh:0 6px 20px rgba(30,70,80,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1d;--card:#18262a;--ink:#eaf4f4;--mute:#8fa8ad;--line:#26393e;--acc:#3dd6c8;--accbg:#12393c;--chip:#1f3236;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a1d;--card:#18262a;--ink:#eaf4f4;--mute:#8fa8ad;--line:#26393e;--acc:#3dd6c8;--accbg:#12393c;--chip:#1f3236;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:0 14px 48px}
.hero{margin:0 -14px 14px;padding:26px 20px 24px;color:#fff;background:linear-gradient(135deg,#f59e0b,#14b8a6 58%,#3b82f6);border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero.f{background:linear-gradient(135deg,#ffa07a,#f58fb3 55%,#a78bfa)}
.hero.m{background:linear-gradient(135deg,#14b8a6,#0ea5e9 55%,#4f46e5)}
.hero small{opacity:.9;font-size:14px}
.hero h1{font:700 26px Georgia,serif;margin:2px 0 14px}
.big{display:flex;align-items:center;gap:16px}
.num{font:800 64px/1 -apple-system,system-ui,sans-serif}
.big .t{font-size:15px;line-height:1.3}.big .t b{font-size:19px;display:block}
.wig{font-size:44px;display:inline-block;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
.hero>*{position:relative;z-index:1}
.hero>.bals{position:absolute;z-index:0;left:0;right:0;top:0;bottom:0;pointer-events:none}
@keyframes fl{50%{transform:translateY(-10px)}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf span{position:absolute;top:0;font-size:24px;animation:fall 3.2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.wig{animation:none}.cf{display:none}}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 13px;cursor:pointer}
button.pri{background:linear-gradient(135deg,#14b8a6,#0ea5e9);border:0;color:#fff;font-weight:600}
button.sm{padding:3px 10px;font-size:13px;border-radius:9px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}
.tabs button{padding:9px 1px;font-size:11.5px;font-weight:600;color:var(--mute);box-shadow:var(--sh)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:5px 13px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:18px}
h2{font:700 17px Georgia,serif;margin:18px 0 8px}
.meta{color:var(--mute);font-size:14px}
.badge{background:var(--accbg);color:var(--acc);border-radius:12px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.badge.due{background:var(--acc);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.tag{background:var(--chip);border-radius:10px;padding:3px 10px;font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.idea{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.sg{padding:9px 0;border-bottom:1px dashed var(--line)}
.sg p{margin:2px 0 4px;font-size:14px;color:var(--mute)}
.lk{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:4px 0 6px}
.lk a{color:var(--acc);background:var(--accbg);border-radius:8px;padding:2px 8px;text-decoration:none}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mini .em{font-size:24px}.mini b{flex:1}
.spark{background:linear-gradient(135deg,var(--accbg),var(--chip))}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;vertical-align:middle;margin-right:8px;flex:none}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=checkbox]{width:auto}
.ni{flex:1;min-width:0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.ct{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ct span{flex:1}.ct input[type=date]{width:150px}
ol{padding-left:20px;margin:6px 0;font-size:14px;color:var(--mute)}
details.gg{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:var(--sh)}
details.gg>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
details.gg>summary::-webkit-details-marker{display:none}
details.gg>summary:after{content:'▾';margin-left:auto;color:var(--mute)}
details.gg[open]>summary:after{content:'▴'}
details.gg .gi{padding:0 14px 12px}
details.gg .cnt{font-weight:400;color:var(--mute);font-size:13px}
details.gg .lk a{padding:5px 11px;border-radius:999px;font-size:14px}
[hidden]{display:none!important}
a.btn.pri{background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:#fff}
a.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:600}
.idea a{color:var(--acc);word-break:break-all}

/* blue blend with little drifting balloons */
.hero,.hero.f,.hero.m{background:linear-gradient(135deg,#14b8a6,#0ea5e9 55%,#4f46e5);color:#fff;border-bottom:0}
.hero small{opacity:.9}
.b{position:absolute;bottom:-50px;left:var(--x);width:var(--w);height:calc(var(--w)*1.22);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--c);box-shadow:inset -3px -4px 0 rgba(0,0,0,.08);opacity:0;animation:rise var(--t) ease-in-out infinite;animation-delay:var(--d)}
.b:before{content:'';position:absolute;left:22%;top:16%;width:20%;height:28%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(20deg)}
.b:after{content:'';position:absolute;left:50%;top:100%;width:1px;height:20px;background:rgba(255,255,255,.7)}
@keyframes rise{0%{transform:translate(0,0) rotate(-5deg);opacity:0}10%{opacity:1}50%{transform:translate(12px,-130px) rotate(5deg)}90%{opacity:1}100%{transform:translate(-10px,-290px) rotate(-5deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.b{animation:none;opacity:.9;bottom:auto;top:40px}}
</style>
</head>
<body>
<main>
<section class="hero" id="hero"></section>
<nav class="tabs">
  <button data-a="tab" data-t="h">🏠 Home</button>
  <button data-a="tab" data-t="p">👥 People</button>
  <button data-a="tab" data-t="w">💝 Wish list</button>
  <button data-a="tab" data-t="r">🔔 Remind</button>
  <button data-a="tab" data-t="s">⚙️ Settings</button>
</nav>

<form id="form" hidden>
  <label>Name</label><input id="fname" required>
  <div class="g3">
    <div><label>Day</label><input id="fday" type="number" min="1" max="31" required></div>
    <div><label>Month</label><select id="fmonth"></select></div>
    <div><label>Birth year</label><input id="fyear" type="number" min="1900" max="2100"></div>
  </div>
  <label>Group</label><select id="fkind"></select>
  <label>Photo</label><div class="row" style="margin-top:0"><span id="phprev"></span><input type="file" id="fphoto" accept="image/*" style="flex:1;min-width:0"><button type="button" class="sm" data-a="rmphoto">Remove</button></div>
  <label>Girl or boy (helps pick the right gift links)</label>
  <select id="fgender"><option value="">Not set</option><option value="f">Girl / Woman</option><option value="m">Boy / Man</option></select>
  <label>Remind me</label>
  <select id="fremind"><option value="">Use my usual setting</option><option value="0">Don’t remind me</option><option value="1">1 day before</option><option value="3">3 days before</option><option value="7">1 week before</option><option value="14">2 weeks before</option><option value="30">1 month before</option></select>
  <div class="row"><button class="pri" type="submit">Save</button><button type="button" data-a="cancel">Cancel</button></div>
</form>

<div class="panel" id="sharebox" hidden>
  <h2 style="margin-top:0">🔄 Share &amp; sync</h2>
  <div class="row" style="margin-top:0"><button data-a="copytext">Copy list as text</button><button data-a="copycode">Copy sync code</button></div>
  <textarea id="out" rows="4" readonly placeholder="Your text or sync code appears here to copy" style="margin-top:8px"></textarea>
  <label>Paste a sync code to merge it in (nothing is ever deleted; photos stay on each device)</label>
  <textarea id="impcode" rows="3" placeholder="BDAY1:..."></textarea>
  <div class="row"><button data-a="merge">Merge</button><span class="meta" id="impmsg"></span></div>
</div>

<div class="panel" id="ctbox" hidden>
  <h2 style="margin-top:0">📇 Import contacts</h2>
  <div class="meta">Web pages can’t open your contacts directly, so save them as a file first:</div>
  <ol><li><b>iPhone:</b> go to icloud.com/contacts, select all (or some), open the cog ⚙ and choose Export vCard.</li>
  <li><b>Android:</b> Contacts → Settings → Export → save as a .vcf file.</li></ol>
  <label>Choose the .vcf file</label><input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard">
  <div id="ctlist"></div>
  <div id="ctact" hidden>
    <label>Add them to group</label><select id="ctkind"></select>
    <div class="row"><button class="pri" data-a="ctadd">Add ticked contacts</button><span class="meta" id="ctmsg"></span></div>
  </div>
</div>

<div id="view"></div>
</main>
<script>
var KEY='bday1-people',SKEY='bday1-settings';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var KINDS={family:'Family',friend:'Friend',work:'Work',godchild:'Godchild',other:'Other'};
var EMO={family:'🏡',friend:'🥳',work:'💼',godchild:'👼',other:'🎈'};
var COL={family:'#f59e0b',friend:'#14b8a6',work:'#6366f1',godchild:'#8b5cf6',other:'#94a3b8'};
var COLG={f:'#f472b6',m:'#0ea5e9'};
function pcol(p){return COLG[p.gender]||COL[p.kind]}
var SEED=[];
var MYK='bday1-mywish',mine=[];
function loadM(){try{var a=JSON.parse(localStorage.getItem(MYK));if(Array.isArray(a))mine=a.filter(w=>w&&w.t)}catch(e){}}
function saveM(){pushMine();mineAt=Date.now();try{localStorage.setItem(MYK,JSON.stringify(mine));localStorage.setItem(AKEY,mineAt)}catch(e){}}
function fixUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u)){if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';u='https://'+u}return u}
function wlink(w){return w.u?'<a href="'+esc(w.u)+'" target="_blank" rel="noopener">'+esc(w.t)+' ↗</a>':esc(w.t)}
function wform(){return '<div class="row"><input class="ni wn" placeholder="What is it?"><input class="ni wu" placeholder="Paste a link (optional)" inputmode="url"></div><div class="row"><button class="sm pri" data-a="addwish">Add</button></div>'}
var FKEY='bday1-favs',NKEY='bday1-myname',AKEY='bday1-mywish-at',favs=[],myname='',mineAt=0,pend=null,favArm=null;
function loadF(){try{var a=JSON.parse(localStorage.getItem(FKEY));if(Array.isArray(a))favs=a}catch(e){}try{myname=localStorage.getItem(NKEY)||''}catch(e){}try{mineAt=+localStorage.getItem(AKEY)||0}catch(e){}}
function saveF(){try{localStorage.setItem(FKEY,JSON.stringify(favs))}catch(e){}}
function fmtDay(ms){var d=new Date(ms),n=new Date();return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():'')}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
var SB='https://hxjdooihotmkrbhbcrmf.supabase.co',SK='sb_publishable_5caGdZ_xYrYKh5UE7Iy2iA_4VS1uBd3',LKEY='bday1-live',live={id:'',sec:'',ok:0},lastRef=0,pushT=null;
function loadL(){try{var o=JSON.parse(localStorage.getItem(LKEY));if(o&&o.id)live=o}catch(e){}}
function saveL(){try{localStorage.setItem(LKEY,JSON.stringify(live))}catch(e){}}
function rid(n){var a=new Uint8Array(n),c='abcdefghijkmnpqrstuvwxyz23456789',s='';(window.crypto||window.msCrypto).getRandomValues(a);for(var i=0;i<n;i++)s+=c[a[i]%32];return s}
function rpc(fn,body){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function pushMine(){
  clearTimeout(pushT);
  pushT=setTimeout(function(){
    if(!live.id){if(!mine.length)return;live={id:rid(16),sec:rid(24),ok:0};saveL()}
    rpc('save_list',{p_id:live.id,p_secret:live.sec,p_name:myname||'',p_items:mine.map(function(w){return [w.t,w.u||'']})})
      .then(function(){live.ok=1;saveL();var m=document.getElementById('wmsg');if(tab==='w'&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render()})
      .catch(function(){live.ok=0;saveL()});
  },500);
}
function fetchList(id){return rpc('get_list',{p_id:id}).then(function(r){var x=r&&r[0];if(!x)return null;return {n:String(x.name||'').slice(0,60),w:(x.items||[]).slice(0,200).map(function(y){return {t:String(y[0]||'').slice(0,200),u:fixUrl(String(y[1]||'').slice(0,1500))}}).filter(function(y){return y.t})}})}
function refreshFavs(force){
  var now=Date.now();if(!force&&now-lastRef<15000)return;lastRef=now;
  favs.forEach(function(f){
    if(!f.id)return;
    fetchList(f.id).then(function(o){
      if(!o)return;
      var oldKeys=f.w.map(function(w){return w.t+'|'+w.u}),newKeys=o.w.map(function(w){return w.t+'|'+w.u});
      if(JSON.stringify(oldKeys)===JSON.stringify(newKeys)&&(!o.n||o.n===f.n))return;
      var add=newKeys.filter(function(k){return oldKeys.indexOf(k)<0}).length;
      f.w=o.w;if(o.n)f.n=o.n;if(add||JSON.stringify(oldKeys)!==JSON.stringify(newKeys)){f.upd=true;f.add=(f.add||0)+add}
      saveF();if(tab==='w'&&!document.querySelector('details[open]')&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render();
    }).catch(function(){});
  });
}
function wlCode(){if(live.ok)return 'LIVE:'+live.id;return 'WISH1:'+b64e({n:myname||'',d:mineAt||Date.now(),w:mine.map(w=>[w.t,w.u||''])})}
function wlLink(){var b=location.href.split('#')[0];return live.ok?b+'#l='+live.id:b+'#wl='+encodeURIComponent(wlCode().slice(6))}
function wlText(){return '💝 '+(myname?myname+'’s':'My')+' wish list\n'+mine.map(w=>'• '+w.t+(w.u?' — '+w.u:'')).join('\n')+(live.ok?'\n\nTap to add it to your favourites in the Birthdays app. It updates automatically:\n':'\n\nTap to add it to your favourites in the Birthdays app:\n')+wlLink()}
function parseLive(str){str=String(str||'').trim();var m=str.match(/(?:[#&?]l=|^LIVE:)([a-z0-9]{12,40})/i);return m?m[1]:null}
function startPend(id){if(id===live.id){pend=null;return 'That’s your own list.'}pend={live:1,id:id,n:'Loading…',w:[]};fetchList(id).then(function(o){if(!pend||pend.id!==id)return;if(!o){pend=null;var m=document.getElementById('wmsg');if(m)m.textContent='Couldn’t find that list.';render();return}pend.n=o.n||'A friend';pend.w=o.w;pend.loaded=1;render()}).catch(function(){if(pend&&pend.id===id){pend=null;var m=document.getElementById('wmsg');if(m)m.textContent='Couldn’t reach the list. Check your connection and try again.';render()}});return ''}
function parseWL(str){
  try{
    str=String(str||'').trim();var m=str.match(/wl=([^&\s]+)/i),b;
    if(m)b=decodeURIComponent(m[1]);else if(/^WISH1:/i.test(str))b=str.slice(6).replace(/\s+/g,'');else b=str.replace(/\s+/g,'');
    var o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||!Array.isArray(o.w))return null;
    var w=o.w.slice(0,200).map(x=>({t:String(x[0]||'').slice(0,200),u:fixUrl(String(x[1]||'').slice(0,1500))})).filter(x=>x.t);
    return {n:String(o.n||'').slice(0,60)||'A friend',d:+o.d||Date.now(),w:w};
  }catch(e){return null}
}
function saveFav(o){
  if(o.live){var e2=favs.find(function(f){return f.id===o.id});if(e2){saveF();return o.n+'’s list is already in your favourites.'}favs.push({id:o.id,n:o.n,w:o.w,d:Date.now(),r:Date.now(),upd:false,add:0});saveF();return o.n+'’s list saved to favourites ⭐ It will update by itself.'}
  var ex=favs.find(f=>f.n.toLowerCase()===o.n.toLowerCase()),msg;
  if(ex){
    if(o.d<=ex.d){msg='You already have the latest version of '+o.n+'’s list.'}
    else{var add=o.w.filter(x=>!ex.w.some(y=>y.t===x.t&&y.u===x.u)).length;ex.w=o.w;ex.d=o.d;ex.r=Date.now();ex.upd=true;ex.add=add;msg=o.n+'’s list updated'+(add?' · '+add+' new':'')+'.'}
  }else{favs.push({n:o.n,w:o.w,d:o.d,r:Date.now(),upd:false,add:0});msg=o.n+'’s list saved to favourites ⭐'}
  saveF();return msg;
}
function pendHtml(){
  if(!pend)return '';
  return '<div class="card spark"><div class="name">💌 '+esc(pend.n)+' shared a wish list</div><div class="meta">'+pend.w.length+' item'+(pend.w.length===1?'':'s')+'</div>'
  +pend.w.slice(0,8).map(w=>'<div class="idea"><span>'+wlink(w)+'</span></div>').join('')+(pend.w.length>8?'<div class="meta">…and '+(pend.w.length-8)+' more</div>':'')
  +'<div class="row">'+(pend.live&&!pend.loaded?'<span class="meta">Loading…</span>':'<button class="pri sm" data-a="savepend">⭐ Save to favourites</button><button class="sm" data-a="copypend">Copy code</button>')+'<button class="sm" data-a="droppend">Dismiss</button></div>'
  +'<div class="meta" style="margin-top:6px">Using the Home Screen icon? Tap Copy code, then paste it into Favourites in the app.</div></div>';
}
function favsHtml(){
  var h='<h2>⭐ Favourites</h2><div class="card"><div class="meta">Wish lists friends have shared with you. They update here by themselves.</div><div class="row"><input class="ni" id="pastewl" placeholder="Paste a wish list link or code" style="flex:1;min-width:0"><button class="sm pri" data-a="importwl">Add</button></div></div>';
  if(!favs.length)return h+'<div class="empty">No favourites yet 💝</div>';
  return h+favs.map((f,i)=>({f:f,i:i})).sort((a,b)=>(b.f.r||0)-(a.f.r||0)).map(r=>{var f=r.f;
    return '<details class="card" style="padding:0"><summary data-a="favopen" data-k="'+r.i+'" style="padding:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="name">⭐ '+esc(f.n)+'</span><span>'+(f.upd?'<span class="badge nb">🆕 Updated'+(f.add?' · '+f.add+' new':'')+'</span> ':'')+'<span class="meta">'+f.w.length+' item'+(f.w.length===1?'':'s')+'</span></span></summary>'
    +'<div style="padding:0 14px 14px">'
    +(f.w.map(w=>'<div class="idea"><span>'+wlink(w)+'</span></div>').join('')||'<div class="meta">Empty list.</div>')
    +'<div class="row"><button class="sm" data-a="rmfav" data-k="'+r.i+'">'+(favArm===r.i?'Tap again to remove':'Remove')+'</button></div></div></details>';
  }).join('');
}
var people=[],S={lead:7},filter='all',tab='h',editing=null,delArm=null,cts=[],browse={age:'',kind:'friend',gender:''},sur=-1,ideaFor='all',editPhoto='';

/* ---------- data ---------- */
function norm(p){
  if(typeof p.ideas==='string')p.ideas=p.ideas.split('\n').map(s=>s.trim()).filter(Boolean);
  p.ideas=p.ideas||[];
  p.wishes=(p.wishes||[]).filter(w=>w&&w.t);
  p.ideas.forEach(i=>{if(!p.wishes.some(w=>w.t===i))p.wishes.push({t:i,u:''})});p.ideas=[];
  p.given=(p.given||[]).map(g=>typeof g==='string'?{year:0,gift:g}:g);
  if(!KINDS[p.kind])p.kind='other';
  p.year=+p.year||0;
  p.gender=(p.gender==='f'||p.gender==='m')?p.gender:'';
  if(p.remind===''||p.remind===undefined)p.remind=null;
  return p;
}
function load(){try{var s=localStorage.getItem(KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a.map(norm)}}catch(e){}return JSON.parse(JSON.stringify(SEED)).map(norm)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function loadS(){try{var s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.lead>=0)S=s}catch(e){}}
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function encode(a){return 'BDAY1:'+btoa(unescape(encodeURIComponent(JSON.stringify(a,function(k,v){return k==='photo'?undefined:v}))))}
function decode(t){t=t.replace(/\s+/g,'');if(t.slice(0,6).toUpperCase()!=='BDAY1:')throw 0;var a=JSON.parse(decodeURIComponent(escape(atob(t.slice(6)))));if(!Array.isArray(a))throw 0;return a}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function nextDate(p){var t=today(),d=new Date(t.getFullYear(),p.month-1,p.day);if(d<t)d=new Date(t.getFullYear()+1,p.month-1,p.day);return d}
function daysUntil(p){return Math.round((nextDate(p)-today())/864e5)}
function turning(p){return p.year?nextDate(p).getFullYear()-p.year:null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function av(p,s){s=s||40;return p.photo?'<img class="av" style="width:'+s+'px;height:'+s+'px" src="'+p.photo+'" alt="">':'<span class="av" style="width:'+s+'px;height:'+s+'px;background:'+pcol(p)+';font-size:'+Math.round(s*.45)+'px">'+esc((p.name||'?').trim().charAt(0).toUpperCase())+'</span>'}
function audA(a,k){if(k==='godchild')return 'k';if(a==null||a==='')return '';return a<=14?'k':a>=18?'a':''}
function aud(p){return audA(turning(p),p.kind)}
function byDate(){return people.slice().sort((a,b)=>daysUntil(a)-daysUntil(b))}
function when(d){return d===0?'today':d===1?'tomorrow':'in '+d+' days'}
function fmt(d){return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function lead(p){return p.remind==null?S.lead:+p.remind}
function isDue(p){var l=lead(p);return l>0&&daysUntil(p)<=l}
function lastGift(p){var g=p.given.slice().sort((a,b)=>(b.year||0)-(a.year||0))[0];return g?(g.year?g.year+': ':'')+g.gift:null}

/* ---------- calendar reminders ---------- */
function ymd(d){return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function gcal(title,start,recur,det){
  var end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+ymd(start)+'/'+ymd(end)+(recur?'&recur='+encodeURIComponent('RRULE:FREQ=YEARLY'):'')+'&details='+encodeURIComponent(det||'');
}
function icsEsc(t){return String(t).replace(/[\\,;]/g,function(c){return '\\'+c}).replace(/\n/g,'\\n')}
function buildIcs(){
  var now=new Date(),z=function(n){return ('0'+n).slice(-2)},
  st=now.getUTCFullYear()+z(now.getUTCMonth()+1)+z(now.getUTCDate())+'T'+z(now.getUTCHours())+z(now.getUTCMinutes())+z(now.getUTCSeconds())+'Z',
  L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Birthdays app//EN','CALSCALE:GREGORIAN'];
  people.forEach(function(p){
    var l=lead(p),nd=nextDate(p);
    L.push('BEGIN:VEVENT','UID:'+p.id+'@birthdays-app','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+ymd(nd),'RRULE:FREQ=YEARLY','SUMMARY:'+icsEsc(p.name+'’s birthday'),'TRANSP:TRANSPARENT');
    if(l>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Sort a present for '+p.name),'TRIGGER:-PT'+(l*24-9)+'H','END:VALARM');
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(p.name+'’s birthday today'),'TRIGGER:PT9H','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function downloadIcs(){
  var txt=buildIcs(),blob=new Blob([txt],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='birthdays.ics';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000);
}
function remDate(p){var nd=nextDate(p);return new Date(nd.getFullYear(),nd.getMonth(),nd.getDate()-lead(p))}

/* ---------- fun ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var c=document.createElement('div'),e=['🎉','🎈','✨','🎁','🥳'],h='';
  for(var i=0;i<28;i++)h+='<span style="left:'+Math.random()*96+'%;animation-delay:'+Math.random()*1.2+'s">'+e[i%e.length]+'</span>';
  c.className='cf';c.innerHTML=h;document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

/* ---------- render ---------- */
function balHtml(){
  var c=['#ffd34d','#4fc3f7','#ffffff','#81c784','#ff9ec7','#c4a1ff','#ffab6b'],h='';
  for(var i=0;i<22;i++){var w=14+(i*7%5)*3;
    h+='<i class="b" style="--c:'+c[i%7]+';--x:'+((i*43)%94+2)+'%;--w:'+w+'px;--t:'+(15+(i*11%10))+'s;--d:'+(-(i*13%24))+'s"></i>';}
  return '<div class="bals" aria-hidden="true">'+h+'</div>';
}
function hero(){
  var n=byDate()[0],h=document.getElementById('hero');h.className='hero '+((n&&n.gender)||'n');
  if(!n){h.innerHTML=balHtml()+'<small>'+greet()+'!</small><h1>Birthdays</h1><div class="big"><span class="wig">🎈</span><div class="t"><b>No birthdays yet</b>Tap People, then + Add.</div></div>';return}
  var d=daysUntil(n),a=turning(n);
  h.innerHTML=balHtml()+'<small>'+greet()+'! Next up</small><h1>'+av(n,38)+esc(n.name)+'</h1><div class="big">'+(d===0?'<span class="wig" style="font-size:64px">🎉</span><div class="t"><b>It’s their birthday today!</b>'+(a?'Turning '+a:'')+'</div>':'<div class="num">'+d+'</div><div class="t"><b>day'+(d===1?'':'s')+' to go</b>'+fmt(nextDate(n))+(a?' · turning '+a:'')+'</div>')+'</div>';
}
var openP={};
function card(p){
  var d=daysUntil(p),age=turning(p);
  var gv=p.given.slice().sort((a,b)=>(b.year||0)-(a.year||0));
  return '<div class="card" style="border-left:6px solid '+pcol(p)+'" data-id="'+esc(p.id)+'"><div class="top" data-a="tog" style="cursor:pointer"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">'+p.day+' '+MONTHS[p.month-1]+(age?' · turns '+age:'')+'</div></div><div style="display:flex;gap:8px;align-items:center"><div class="badge'+(isDue(p)?' due':'')+'">'+(d===0?'Today!':d+' day'+(d===1?'':'s'))+'</div><span class="meta">'+(openP[p.id]?'▲':'▼')+'</span></div></div>'
  +'<div'+(openP[p.id]?'':' hidden')+'><div class="meta">'+KINDS[p.kind]+(p.year?' · born '+p.year:'')+'</div><div class="lbl">💝 Wish list</div>'
  +(p.wishes.map((w,k)=>'<div class="idea"><span>'+wlink(w)+'</span><span><button class="sm" data-a="given" data-k="'+k+'">✓ Given</button> <button class="sm" data-a="rmwish" data-k="'+k+'">✕</button></span></div>').join('')||'<div class="meta">Nothing yet. Add something and a link below.</div>')
  +wform()
  +'<div class="lbl">🎁 Previous presents</div>'
  +(p.given.map((g,i)=>({g:g,i:i})).sort((a,b)=>(b.g.year||0)-(a.g.year||0)).map(r=>'<div class="idea"><span><b>'+(r.g.year||'—')+'</b> · '+esc(r.g.gift)+'</span><button class="sm" data-a="rmgift" data-k="'+r.i+'">✕</button></div>').join('')||'<div class="meta">None logged yet.</div>')
  +'<div class="row"><input class="ni gy" type="number" style="width:84px;flex:none" placeholder="Year" value="'+new Date().getFullYear()+'"><input class="ni gt" placeholder="What did you give?"></div><div class="row"><button class="sm pri" data-a="addgift">Add present</button></div>'
  +'<div class="row"><button class="sm" data-a="edit">Edit</button><button class="sm" data-a="del">'+(delArm===p.id?'Tap again to delete':'Delete')+'</button></div></div></div>';
}
function view(){
  var A=byDate(),v='';
  if(tab==='h'){
    var due=A.filter(isDue);
    v+='<div class="bar"><button class="pri" data-a="add">＋ Add a birthday</button></div>';
    if(due.length)v+='<h2>🎁 Time to sort a present</h2>'+due.map(p=>'<div class="card" data-id="'+esc(p.id)+'"><div class="top"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">'+(daysUntil(p)===0?'Today!':'Birthday '+when(daysUntil(p)))+(lastGift(p)?' · last: '+esc(lastGift(p)):'')+'</div></div><button class="sm pri" data-a="opencard">Open card</button></div></div>').join('');
    if(A.length)v+='<h2>🗓️ Coming up</h2><div class="card">'+A.slice(0,5).map(p=>'<div class="mini" data-a="opencard" data-id="'+esc(p.id)+'" style="cursor:pointer">'+av(p,34)+'<b style="color:var(--acc)">'+esc(p.name)+'</b><span class="meta">'+fmt(nextDate(p))+'</span><span class="badge">'+daysUntil(p)+'d</span></div>').join('')+'</div>';
    else v+='<div class="empty">No birthdays yet. Tap ＋ Add a birthday 🎈</div>';
  }else if(tab==='p'){
    var kinds=['all'];people.forEach(p=>{if(kinds.indexOf(p.kind)<0)kinds.push(p.kind)});
    v+='<div class="bar"><button class="pri" data-a="add">＋ Add</button></div>'
    +'<div class="bar">'+kinds.map(k=>'<button class="chip'+(k===filter?' on':'')+'" data-a="filter" data-k="'+k+'">'+(k==='all'?'All':EMO[k]+' '+KINDS[k])+'</button>').join('')+'</div>'
    +(A.filter(p=>filter==='all'||p.kind===filter).map(card).join('')||'<div class="empty">No birthdays here yet 🎈</div>');
  }else if(tab==='w'){
    v+=pendHtml()
    +'<div class="card spark"><div class="name">💝 My wish list</div><div class="meta">Add things you’d love, with a link. Share your link once and friends always see your latest list.</div>'
    +'<label>Your name (shown when you share)</label><input id="myname" data-a="myname" placeholder="e.g. Tatty" value="'+esc(myname)+'">'
    +'<div id="mw">'+wform()+'</div></div>'
    +(mine.length?'<div class="card">'+mine.map((w,k)=>'<div class="idea"><span>'+wlink(w)+'</span><button class="sm" data-a="rmmine" data-k="'+k+'">✕</button></div>').join('')+'</div>'
    +'<div class="row"><a class="pri btn" href="https://wa.me/?text='+encodeURIComponent(wlText())+'" target="_blank" rel="noopener">Share on WhatsApp</a><button data-a="copylink">Copy link</button><button data-a="copywish">Copy list</button></div><div class="meta" id="wmsg"></div>':'<div class="empty">Nothing on your list yet 🎁</div><div class="meta" id="wmsg"></div>')
    +favsHtml();
  }else if(tab==='s'){
  }else{
    v+='<div class="card"><div class="name">How early should I remind you?</div><div class="meta">Your usual setting. You can change it for one person when you edit them.</div><div class="bar" style="margin-top:10px">'+[[1,'1 day'],[3,'3 days'],[7,'1 week'],[14,'2 weeks'],[30,'1 month']].map(x=>'<button class="chip'+(S.lead===x[0]?' on':'')+'" data-a="lead" data-k="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'
    +(people.length?'<div class="card"><div class="name">📅 Apple Calendar</div><div class="meta">One tap adds every birthday as a yearly event, with an alert before it (your reminder setting) and another at 9am on the day.</div><div class="row"><button class="pri" data-a="ics">Add all to Apple Calendar</button></div><div class="meta" style="margin-top:8px">On iPhone: tap Download, then open <b>birthdays.ics</b> from the Downloads list or the Files app, and choose <b>Add All</b>. This is a one-off copy, so if you change a birthday later, tap again and add it again.</div></div>':'')+'<div class="card spark meta">This page can’t buzz your phone while it’s closed. Reminders show on the Home tab each time you open it. For real alerts, add the calendar events below to Google Calendar.</div>'
    +(A.map(p=>{var l=lead(p),rd=remDate(p),a=turning(p);
      return '<div class="card" data-id="'+esc(p.id)+'"><div class="top"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">Birthday '+fmt(nextDate(p))+' · '+(l>0?'reminder '+(isDue(p)?'is due now':'on '+fmt(rd)):'reminders off')+'</div></div>'+(isDue(p)?'<span class="badge due">Due</span>':'')+'</div><div class="lk" style="margin-top:8px"><a href="'+gcal(p.name+'’s birthday'+(a?' (turns '+a+')':''),nextDate(p),1,'Birthday reminder')+'" target="_blank" rel="noopener">📅 Yearly birthday event</a>'+(l>0?'<a href="'+gcal('🎁 Sort a present for '+p.name,rd,0,'Birthday is '+fmt(nextDate(p)))+'" target="_blank" rel="noopener">⏰ Present reminder</a>':'')+'</div></div>'}).join('')||'<div class="empty">Add someone first.</div>');
  }
  document.getElementById('view').innerHTML=v;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-t')===tab));
  show('sharebox',tab==='s');show('ctbox',tab==='s');
  hero();view();
}

/* ---------- actions ---------- */
function show(id,on){document.getElementById(id).hidden=!on}
function go(t){tab=t;if(t==='w')refreshFavs();render();window.scrollTo(0,0)}
function openForm(p){
  editing=p?p.id:null;show('form',1);
  fname.value=p?p.name:'';fday.value=p?p.day:'';fmonth.value=p?p.month:1;fyear.value=p&&p.year?p.year:'';
  fkind.value=p?p.kind:'family';fremind.value=p&&p.remind!=null?p.remind:'';fgender.value=p?p.gender||'':'';fphoto.value='';editPhoto=p&&p.photo||'';showPh();
  form.scrollIntoView({behavior:'smooth'});fname.focus();
}
function copy(txt){
  out.value=txt;out.select();
  try{navigator.clipboard.writeText(txt)}catch(e){try{document.execCommand('copy')}catch(_){}}
}
function asText(){return 'Birthdays\n'+byDate().map(p=>p.name+' — '+p.day+' '+MONTHS[p.month-1]+(turning(p)?' (turns '+turning(p)+')':'')+' · '+KINDS[p.kind]).join('\n')}
function merge(inc){
  var n=0;
  inc.forEach(x=>{
    x=norm(x);
    var m=people.find(p=>p.id===x.id||(p.name.toLowerCase()===x.name.toLowerCase()&&p.day===x.day&&p.month===x.month));
    if(!m){people.push(x);n++;return}
    if(!m.year&&x.year)m.year=x.year;
    if(!m.gender&&x.gender)m.gender=x.gender;
    if(!m.photo&&x.photo)m.photo=x.photo;
    x.wishes.forEach(w=>{if(!m.wishes.some(v=>v.t===w.t&&v.u===w.u))m.wishes.push(w)});
    x.given.forEach(g=>{if(!m.given.some(h=>h.gift===g.gift&&h.year===g.year))m.given.push(g)});
  });
  return n;
}
function parseVcf(t){
  t=t.replace(/\r?\n[ \t]/g,'');
  return t.split(/BEGIN:VCARD/i).slice(1).map(c=>{
    var fn=(c.match(/^FN[^:\n]*:(.*)$/mi)||[])[1];
    if(!fn){var n=(c.match(/^N[^:\n]*:(.*)$/mi)||[])[1];if(n){var a=n.split(';');fn=((a[1]||'')+' '+(a[0]||'')).trim()}}
    var b=(c.match(/^(?:item\d+\.)?BDAY[^:\n]*:(.*)$/mi)||[])[1],bd=null,m;
    if(b){b=b.trim();
      if(m=b.match(/^(\d{4})-?(\d{2})-?(\d{2})/))bd={y:+m[1]<1900?0:+m[1],m:+m[2],d:+m[3]};
      else if(m=b.match(/^--(\d{2})-?(\d{2})/))bd={y:0,m:+m[1],d:+m[2]};}
    return fn&&fn.trim()?{name:fn.trim().replace(/\\,/g,','),bd:bd,on:!!bd}:null;
  }).filter(Boolean);
}
function renderCts(){
  ctlist.innerHTML=cts.length?'<div class="lbl">'+cts.filter(c=>c.bd).length+' of '+cts.length+' have a birthday saved</div>'+cts.map((c,i)=>'<div class="ct"><input type="checkbox" data-a="ctchk" data-i="'+i+'"'+(c.on?' checked':'')+'><span>'+esc(c.name)+'</span>'+(c.bd?'<span class="meta" style="flex:none">'+c.bd.d+' '+MONTHS[c.bd.m-1]+(c.bd.y?' '+c.bd.y:'')+'</span>':'<input type="date" data-a="ctdate" data-i="'+i+'" title="Add a birthday">')+'</div>').join(''):'<div class="meta">No contacts found in that file.</div>';
  show('ctact',cts.length);
}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=160,c=document.createElement('canvas');c.width=c.height=s;var m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',.8))};im.onerror=function(){cb('')};im.src=r.result};r.readAsDataURL(file)}
function showPh(){document.getElementById('phprev').innerHTML=editPhoto?'<img class="av" style="width:56px;height:56px" src="'+editPhoto+'" alt="">':''}
fphoto.onchange=function(){var f=fphoto.files[0];if(f)shrink(f,function(u){if(u){editPhoto=u;showPh()}})};
vcf.onchange=function(){
  var f=vcf.files[0];if(!f)return;
  var r=new FileReader();r.onload=()=>{cts=parseVcf(String(r.result));renderCts()};r.readAsText(f);
};
form.onsubmit=function(e){
  e.preventDefault();
  var o={name:fname.value.trim(),day:+fday.value,month:+fmonth.value,year:+fyear.value||0,kind:fkind.value,remind:fremind.value===''?null:+fremind.value,gender:fgender.value,photo:editPhoto};
  if(!o.name||o.day<1||o.day>31)return;
  if(editing){Object.assign(people.find(x=>x.id===editing),o)}
  else{o.id=Math.random().toString(36).slice(2,14);o.given=[];o.wishes=[];o.ideas=[];people.push(o)}
  save();show('form',0);render();
};
document.addEventListener('change',function(e){
  var a=e.target.getAttribute('data-a'),i=e.target.getAttribute('data-i');
  if(a==='myname'){myname=e.target.value.trim().slice(0,40);try{localStorage.setItem(NKEY,myname)}catch(x){}if(live.id||mine.length)pushMine();render()}
  if(a==='ctchk')cts[i].on=e.target.checked;
  if(a==='ctdate'&&e.target.value){var m=e.target.value.split('-');cts[i].bd={y:+m[0],m:+m[1],d:+m[2]};cts[i].on=true;renderCts()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList.contains('ni')){var b=e.target.parentNode.querySelector('button');if(b)b.click()}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;
  var a=t.getAttribute('data-a'),k=t.getAttribute('data-k'),cd=t.closest('[data-id]'),p=cd&&people.find(x=>x.id===cd.getAttribute('data-id'));
  if(a!=='del')delArm=null;if(a==='del'||a==='addgift'||a==='rmgift'||a==='addidea'||a==='rmidea'||a==='given'||a==='edit'){if(p)openP[p.id]=true}
  if(a==='add'){if(tab!=='p')go('p');openForm(null)}
  else if(a==='cancel')show('form',0);
  else if(a==='share'){show('sharebox',sharebox.hidden);show('ctbox',0)}
  else if(a==='contacts'){show('ctbox',ctbox.hidden);show('sharebox',0)}
  else if(a==='tab')go(t.getAttribute('data-t'));
  else if(a==='opencard'){if(p){filter='all';openP[p.id]=true;tab='p';render();var el=document.querySelector('.card[data-id="'+p.id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}}
  else if(a==='tog'){openP[p.id]=!openP[p.id];render()}
  else if(a==='ics'){downloadIcs()}
  else if(a==='gender'){p.gender=k;save();render()}
  else if(a==='addgift'){var gt=cd.querySelector('.gt').value.trim();if(p&&gt){p.given.push({year:+cd.querySelector('.gy').value||0,gift:gt});openP[p.id]=true;save();render()}}
  else if(a==='rmgift'){p.given.splice(+k,1);save();render()}
  else if(a==='rmphoto'){editPhoto='';showPh();fphoto.value=''}
  else if(a==='filter'){filter=k;render()}
  else if(a==='lead'){S.lead=+k;saveS();render()}
  else if(a==='edit')openForm(p);
  else if(a==='del'){if(delArm===p.id){people=people.filter(x=>x!==p);delArm=null;save()}else delArm=p.id;render()}
  else if(a==='addwish'){var bx=cd||document.getElementById('mw'),n=bx.querySelector('.wn').value.trim(),u=fixUrl(bx.querySelector('.wu').value);if(!n&&u){try{n=new URL(u).hostname.replace(/^www\./,'')}catch(x){}}if(n){var tgt=p?p.wishes:mine;tgt.push({t:n,u:u});p?save():saveM();if(p)openP[p.id]=true}render()}
  else if(a==='rmwish'){p.wishes.splice(+k,1);save();render()}
  else if(a==='rmmine'){mine.splice(+k,1);saveM();render()}
  else if(a==='savepend'){var mm=saveFav(pend);pend=null;try{history.replaceState(null,'',location.href.split('#')[0])}catch(x){}render();var wm=document.getElementById('wmsg');if(wm)wm.textContent=mm}
  else if(a==='droppend'){pend=null;try{history.replaceState(null,'',location.href.split('#')[0])}catch(x){}render()}
  else if(a==='copypend'){copy(pend.live?'LIVE:'+pend.id:'WISH1:'+b64e({n:pend.n,d:pend.d,w:pend.w.map(w=>[w.t,w.u])}))}
  else if(a==='importwl'){var pv=document.getElementById('pastewl').value,lid=parseLive(pv);if(lid){var er=startPend(lid);render();window.scrollTo(0,0);if(er){var we=document.getElementById('wmsg');if(we)we.textContent=er}return}var o=parseWL(pv);if(o){pend=o;render();window.scrollTo(0,0)}else{var wm2=document.getElementById('wmsg');if(wm2)wm2.textContent='That doesn’t look like a wish list link or code.';else alert('That doesn’t look like a wish list link or code.')}}
  else if(a==='favopen'){var fv=favs[+k];if(fv&&fv.upd){fv.upd=false;fv.add=0;saveF();var nb=t.querySelector('.nb');if(nb)nb.remove()}}
  else if(a==='rmfav'){if(favArm===+k){favs.splice(+k,1);favArm=null;saveF()}else favArm=+k;render()}
  else if(a==='copylink'){copy(wlLink());var wm3=document.getElementById('wmsg');if(wm3)wm3.textContent='Link copied. Paste it into a message.'}
  else if(a==='copywish'){copy('💝 My wish list\n'+mine.map(w=>'• '+w.t+(w.u?' — '+w.u:'')).join('\n'));wmsg.textContent='Copied.'}
  else if(a==='given'){var g=p.wishes.splice(+k,1)[0];p.given.push({year:new Date().getFullYear(),gift:g.t});save();render();confetti()}
  else if(a==='copytext')copy(asText());
  else if(a==='copycode')copy(encode(people));
  else if(a==='merge'){try{var n=merge(decode(impcode.value));save();render();impmsg.textContent='Merged. '+n+' new '+(n===1?'person':'people')+' added.'}catch(x){impmsg.textContent='That code doesn’t look right.'}}
  else if(a==='ctadd'){
    var n=0;
    cts.forEach(c=>{if(c.on&&c.bd&&!people.some(q=>q.name.toLowerCase()===c.name.toLowerCase()&&q.day===c.bd.d&&q.month===c.bd.m)){people.push({id:Math.random().toString(36).slice(2,14),name:c.name,day:c.bd.d,month:c.bd.m,year:c.bd.y,kind:ctkind.value,ideas:[],wishes:[],given:[],remind:null});n++}});
    save();render();ctmsg.textContent=n+' added.';
  }
});
fmonth.innerHTML=MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
var ko=Object.keys(KINDS).map(k=>'<option value="'+k+'">'+KINDS[k]+'</option>').join('');
fkind.innerHTML=ko;ctkind.innerHTML=ko;ctkind.value='friend';
people=load();loadS();loadM();loadF();
loadL();if(mine.length&&!live.ok)pushMine();
if(/[#&]l=/.test(location.hash)){var hid=parseLive(location.hash);if(hid){tab='w';startPend(hid)}}
else if(/[#&]wl=/.test(location.hash)){pend=parseWL(location.hash);if(pend)tab='w'}
render();
window.addEventListener('hashchange',function(){if(/[#&]l=/.test(location.hash)){var h2=parseLive(location.hash);if(h2){tab='w';startPend(h2);render();window.scrollTo(0,0)}}else if(/[#&]wl=/.test(location.hash)){var o=parseWL(location.hash);if(o){pend=o;tab='w';render();window.scrollTo(0,0)}}});
refreshFavs(1);document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshFavs()});
if(people.some(p=>daysUntil(p)===0))setTimeout(confetti,500);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthdays</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Birthdays">

<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#2b2233;--mute:#7b7088;--line:#f0e4da;--acc:#ff3d81;--accbg:#ffe3ee;--chip:#f6eefb;--sh:0 6px 20px rgba(120,60,90,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121d;--card:#231b2c;--ink:#f6eefb;--mute:#a99bb8;--line:#382d45;--acc:#ff6fa3;--accbg:#43203a;--chip:#2f2540;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121d;--card:#231b2c;--ink:#f6eefb;--mute:#a99bb8;--line:#382d45;--acc:#ff6fa3;--accbg:#43203a;--chip:#2f2540;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:0 14px 48px}
.hero{margin:0 -14px 14px;padding:26px 20px 24px;color:#fff;background:linear-gradient(135deg,#ff7a59,#ff3d81 55%,#8b5cf6);border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero small{opacity:.9;font-size:14px}
.hero h1{font:700 26px Georgia,serif;margin:2px 0 14px}
.big{display:flex;align-items:center;gap:16px}
.num{font:800 64px/1 -apple-system,system-ui,sans-serif}
.big .t{font-size:15px;line-height:1.3}.big .t b{font-size:19px;display:block}
.wig{font-size:44px;display:inline-block;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
.hero>*{position:relative;z-index:1}
.hero>.bals{position:absolute;z-index:0;right:0;top:0;bottom:0;width:36%;pointer-events:none}
.b{position:absolute;bottom:-70px;left:var(--x);width:var(--w);height:calc(var(--w)*1.22);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--c);box-shadow:inset -5px -7px 0 rgba(0,0,0,.08);animation:rise var(--t) ease-in-out infinite;animation-delay:var(--d)}
.b:before{content:'';position:absolute;left:22%;top:16%;width:20%;height:28%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(20deg)}
.b:after{content:'';position:absolute;left:50%;top:100%;width:2px;height:34px;margin-left:-1px;background:rgba(255,255,255,.75);border-radius:2px}
@keyframes rise{0%{transform:translate(0,0) rotate(-5deg);opacity:0}10%{opacity:1}50%{transform:translate(10px,-170px) rotate(5deg)}90%{opacity:1}100%{transform:translate(-8px,-340px) rotate(-5deg);opacity:0}}
@keyframes fl{50%{transform:translateY(-10px)}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf span{position:absolute;top:0;font-size:24px;animation:fall 3.2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.wig{animation:none}.b{animation:none;bottom:24px;opacity:1}.cf{display:none}}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 13px;cursor:pointer}
button.pri{background:linear-gradient(135deg,#ff7a59,#ff3d81);border:0;color:#fff;font-weight:600}
button.sm{padding:3px 10px;font-size:13px;border-radius:9px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}
.tabs button{padding:9px 1px;font-size:11.5px;font-weight:600;color:var(--mute);box-shadow:var(--sh)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:5px 13px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:18px}
h2{font:700 17px Georgia,serif;margin:18px 0 8px}
.meta{color:var(--mute);font-size:14px}
.badge{background:var(--accbg);color:var(--acc);border-radius:12px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.badge.due{background:var(--acc);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.tag{background:var(--chip);border-radius:10px;padding:3px 10px;font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.idea{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.sg{padding:9px 0;border-bottom:1px dashed var(--line)}
.sg p{margin:2px 0 4px;font-size:14px;color:var(--mute)}
.lk{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:4px 0 6px}
.lk a{color:var(--acc);background:var(--accbg);border-radius:8px;padding:2px 8px;text-decoration:none}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mini .em{font-size:24px}.mini b{flex:1}
.spark{background:linear-gradient(135deg,var(--accbg),var(--chip))}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;vertical-align:middle;margin-right:8px;flex:none}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=checkbox]{width:auto}
.ni{flex:1;min-width:0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mute);padding:26px 0}
.ct{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ct span{flex:1}.ct input[type=date]{width:150px}
ol{padding-left:20px;margin:6px 0;font-size:14px;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section class="hero" id="hero"></section>
<nav class="tabs">
  <button data-a="tab" data-t="h">🏠 Home</button>
  <button data-a="tab" data-t="p">👥 People</button>
  <button data-a="tab" data-t="i">💡 Ideas</button>
  <button data-a="tab" data-t="g">🎁 Presents</button>
  <button data-a="tab" data-t="r">🔔 Remind</button>
</nav>

<form id="form" hidden>
  <label>Name</label><input id="fname" required>
  <div class="g3">
    <div><label>Day</label><input id="fday" type="number" min="1" max="31" required></div>
    <div><label>Month</label><select id="fmonth"></select></div>
    <div><label>Birth year</label><input id="fyear" type="number" min="1900" max="2100"></div>
  </div>
  <label>Group</label><select id="fkind"></select>
  <label>Photo</label><div class="row" style="margin-top:0"><span id="phprev"></span><input type="file" id="fphoto" accept="image/*" style="flex:1;min-width:0"><button type="button" class="sm" data-a="rmphoto">Remove</button></div>
  <label>Remind me</label>
  <select id="fremind"><option value="">Use my usual setting</option><option value="0">Don’t remind me</option><option value="1">1 day before</option><option value="3">3 days before</option><option value="7">1 week before</option><option value="14">2 weeks before</option><option value="30">1 month before</option></select>
  <label>Interests &amp; present ideas (one per line)</label><textarea id="fideas" rows="3"></textarea>
  <div class="row"><button class="pri" type="submit">Save</button><button type="button" data-a="cancel">Cancel</button></div>
</form>

<div class="panel" id="sharebox" hidden>
  <div class="row" style="margin-top:0"><button data-a="copytext">Copy list as text</button><button data-a="copycode">Copy sync code</button></div>
  <textarea id="out" rows="4" readonly placeholder="Your text or sync code appears here to copy" style="margin-top:8px"></textarea>
  <label>Paste a sync code to merge it in (nothing is ever deleted; photos stay on each device)</label>
  <textarea id="impcode" rows="3" placeholder="BDAY1:..."></textarea>
  <div class="row"><button data-a="merge">Merge</button><span class="meta" id="impmsg"></span></div>
</div>

<div class="panel" id="ctbox" hidden>
  <div class="meta">Web pages can’t open your contacts directly, so save them as a file first:</div>
  <ol><li><b>iPhone:</b> go to icloud.com/contacts, select all (or some), open the cog ⚙ and choose Export vCard.</li>
  <li><b>Android:</b> Contacts → Settings → Export → save as a .vcf file.</li></ol>
  <label>Choose the .vcf file</label><input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard">
  <div id="ctlist"></div>
  <div id="ctact" hidden>
    <label>Add them to group</label><select id="ctkind"></select>
    <div class="row"><button class="pri" data-a="ctadd">Add ticked contacts</button><span class="meta" id="ctmsg"></span></div>
  </div>
</div>

<div id="view"></div>
</main>
<script>
var KEY='bday1-people',SKEY='bday1-settings';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var KINDS={family:'Family',friend:'Friend',work:'Work',godchild:'Godchild',other:'Other'};
var EMO={family:'🏡',friend:'🥳',work:'💼',godchild:'👼',other:'🎈'};
var COL={family:'#ff7a59',friend:'#14b8a6',work:'#6366f1',godchild:'#d946ef',other:'#94a3b8'};
var SEED=[];
var people=[],S={lead:7},filter='all',tab='h',editing=null,delArm=null,cts=[],browse={age:'',kind:'friend'},sur=-1,ideaFor='all',editPhoto='';

/* ---------- data ---------- */
function norm(p){
  if(typeof p.ideas==='string')p.ideas=p.ideas.split('\n').map(s=>s.trim()).filter(Boolean);
  p.ideas=p.ideas||[];
  p.given=(p.given||[]).map(g=>typeof g==='string'?{year:0,gift:g}:g);
  if(!KINDS[p.kind])p.kind='other';
  p.year=+p.year||0;
  if(p.remind===''||p.remind===undefined)p.remind=null;
  return p;
}
function load(){try{var s=localStorage.getItem(KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a.map(norm)}}catch(e){}return JSON.parse(JSON.stringify(SEED)).map(norm)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function loadS(){try{var s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.lead>=0)S=s}catch(e){}}
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function encode(a){return 'BDAY1:'+btoa(unescape(encodeURIComponent(JSON.stringify(a,function(k,v){return k==='photo'?undefined:v}))))}
function decode(t){t=t.replace(/\s+/g,'');if(t.slice(0,6).toUpperCase()!=='BDAY1:')throw 0;var a=JSON.parse(decodeURIComponent(escape(atob(t.slice(6)))));if(!Array.isArray(a))throw 0;return a}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function nextDate(p){var t=today(),d=new Date(t.getFullYear(),p.month-1,p.day);if(d<t)d=new Date(t.getFullYear()+1,p.month-1,p.day);return d}
function daysUntil(p){return Math.round((nextDate(p)-today())/864e5)}
function turning(p){return p.year?nextDate(p).getFullYear()-p.year:null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function av(p,s){s=s||40;return p.photo?'<img class="av" style="width:'+s+'px;height:'+s+'px" src="'+p.photo+'" alt="">':'<span class="av" style="width:'+s+'px;height:'+s+'px;background:'+COL[p.kind]+';font-size:'+Math.round(s*.45)+'px">'+esc((p.name||'?').trim().charAt(0).toUpperCase())+'</span>'}
function audA(a,k){if(k==='godchild')return 'k';if(a==null||a==='')return '';return a<=14?'k':a>=18?'a':''}
function aud(p){return audA(turning(p),p.kind)}
function ideaRows(p){return '<div class="lbl">Saved ideas &amp; interests</div>'+(p.ideas.map((i,k)=>'<div class="idea"><span>'+esc(i)+'</span><span><button class="sm" data-a="given" data-k="'+k+'">✓ Given</button> <button class="sm" data-a="rmidea" data-k="'+k+'">✕</button></span></div>').join('')||'<div class="meta">None yet. Add one below.</div>')+'<div class="row"><input class="ni" placeholder="Add an idea or interest"><button class="sm" data-a="addidea">Add</button></div>'}
function chips(){return '<div class="bar"><button class="chip'+(ideaFor==='all'?' on':'')+'" data-a="ideafor" data-k="all">Everyone</button>'+byDate().map(p=>'<button class="chip'+(ideaFor===p.id?' on':'')+'" data-a="ideafor" data-k="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('')+'</div>'}
function giftsView(A){
  if(!A.length)return '<div class="empty">Add someone first.</div>';
  var y=new Date().getFullYear(),n=0;A.forEach(p=>n+=p.given.length);
  var v='<div class="card spark"><div class="name">🎁 Log a present you gave</div><label>Who for</label><select id="gp">'+A.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select><div class="row"><input id="gy" type="number" style="width:90px" value="'+y+'"><input class="ni" id="gt" placeholder="What did you give?"></div><div class="row"><button class="pri sm" data-a="addgift">Add to previous presents</button></div></div>';
  var has=A.filter(p=>p.given.length).sort((a,b)=>a.name.localeCompare(b.name));
  v+='<h2>Previous presents ('+n+')</h2>';
  if(!has.length)return v+'<div class="empty">Nothing logged yet. Tap ✓ Given on an idea, or add one above.</div>';
  return v+has.map(p=>{var rows=p.given.map((g,i)=>({g:g,i:i})).sort((a,b)=>(b.g.year||0)-(a.g.year||0));return '<div class="card" data-id="'+esc(p.id)+'"><div class="name">'+av(p,36)+esc(p.name)+'</div>'+rows.map(r=>'<div class="idea"><span><b>'+(r.g.year||'—')+'</b> · '+esc(r.g.gift)+'</span><button class="sm" data-a="rmgift" data-k="'+r.i+'">✕</button></div>').join('')+'</div>'}).join('');
}
function byDate(){return people.slice().sort((a,b)=>daysUntil(a)-daysUntil(b))}
function when(d){return d===0?'today':d===1?'tomorrow':'in '+d+' days'}
function fmt(d){return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function lead(p){return p.remind==null?S.lead:+p.remind}
function isDue(p){var l=lead(p);return l>0&&daysUntil(p)<=l}
function lastGift(p){var g=p.given.slice().sort((a,b)=>(b.year||0)-(a.year||0))[0];return g?(g.year?g.year+': ':'')+g.gift:null}

/* ---------- ideas ---------- */
var ML='https://mimiandlula.com/collections/',WU='https://www.wickeduncle.co.uk/';
var LK={
 'wu-craft':['Wicked Uncle · Crafty kids',WU+'categories/creativity'],
 'wu-out':['Wicked Uncle · Outdoor explorers',WU+'categories/outdoorsy'],
 'wu-style':['Wicked Uncle · Fashion & style',WU+'categories/fashion--style'],
 'ml-dress':['Mimi & Lula · Dress up',ML+'dress-up'],
 'ml-hair':['Mimi & Lula · Hair',ML+'hair'],
 'ml-bags':['Mimi & Lula · Bags',ML+'bags'],
 'ml-jewel':['Mimi & Lula · Jewellery',ML+'jewellery'],
 'ml-older':['Mimi & Lula · Older girls',ML+'older-girls'],
 'ar':['Addison Ross · Gifts for her','https://www.addisonross.com/collections/gifts-for-her'],
 'ort':['Ortigia at Selfridges','https://www.selfridges.com/GB/en/cat/ortigia-sicilia']
};
function linkRow(keys,age){
  var L=[];
  (keys||[]).forEach(function(k){
    if(k==='age'){if(age<1)L.push(['Wicked Uncle · Babies',WU+'presents/all/babies']);else if(age<=14)L.push(['Wicked Uncle · Age '+age,WU+'presents/all/age-'+age])}
    else if(k.indexOf('wu')===0){if(age<=14)L.push(LK[k])}
    else if(LK[k])L.push(LK[k]);
  });
  return L.length?'<div class="lk">'+L.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join('')+'</div>':'';
}
var BR=[
 [2,[['Soft toy',['age']],['Board book',['age']],['Baby keepsake',['age']]]],
 [5,[['Building blocks',['age']],['Picture book',['age']],['Dressing-up outfit',['ml-dress','age']],['Hair or bag accessories',['ml-hair','ml-bags']]]],
 [8,[['LEGO set',['age']],['Illustrated story book',['age']],['Craft or art kit',['wu-craft','age']],['Hair, bag or jewellery accessories',['ml-hair','ml-bags','ml-jewel']]]],
 [12,[['Science experiment kit',['age']],['Family board game',['age']],['Adventure book series',['wu-out','age']],['Hair, bag or jewellery accessories',['ml-hair','ml-bags','ml-jewel','ml-older']]]],
 [17,[['Wireless earbuds',[]],['Hoodie or trainers',['wu-style']],['Jewellery or accessories',['ml-older','ml-jewel']],['Gift card',[]]]],
 [29,[['Experience day',[]],['Photo frame or keepsake',['ar']],['Fragrance or bath gift set',['ort']]]],
 [49,[['Weekend experience',[]],['Scented candle or fragrance',['ort']],['Photo frame or home accessory',['ar']],['Cookbook',[]]]],
 [64,[['Garden gift',[]],['Walking accessories',[]],['Photo frame or home accessory',['ar']],['Fragrance or bath gift set',['ort']]]],
 [999,[['Photo frame of the family',['ar']],['Cosy blanket or slippers',[]],['Afternoon tea gift',[]]]]
];
var MILE=[1,5,10,16,18,21,30,40,50,60,65,70,75,80,90,100];
var CREA=[
 ['🌌 Star map of their birth night','A print of the sky on the day they were born.'],
 ['🗺️ Map of a place that matters','Where they grew up, met someone, or got married.'],
 ['🫙 Jar of 50 memories','Write a memory or reason you love them on each note.'],
 ['🎟️ Book of favours','Hand-made coupons: a lie-in, a cooked dinner, a day out.'],
 ['🎧 Playlist of their year','Songs from every month, with a handwritten track list.'],
 ['🐾 Adopt an animal','A symbolic adoption with a certificate and updates.'],
 ['🍳 Cook-along or tasting class','Something to do together, not just to unwrap.'],
 ['🖼️ Illustrated portrait','An artist draws them, their pet or their home.'],
 ['📦 Subscription that keeps giving','Monthly treats, plants, coffee or books.'],
 ['📖 Family recipe book','Collect favourite recipes in handwriting.'],
 ['🧩 Photo jigsaw','A favourite photo turned into a puzzle.'],
 ['🧭 Mini adventure you plan','A secret itinerary with clues for each stop.'],
 ['✉️ Letters to open all year','Twelve envelopes, one for each month.'],
 ['🌱 Grow-your-own kit','Herbs, mushrooms or a tiny garden.'],
 ['💿 Song pressed on vinyl','Their favourite song, or your wedding song.'],
 ['🏺 Make-something workshop','Pottery, candle making, woodwork or painting.']
];
function sugg(age,kind){
  var b=BR.find(function(x){return age<=x[0]})[1].map(function(s){return [s[0],s[1],age]});
  if(MILE.indexOf(age)>=0){
    b.unshift([ord(age)+' birthday keepsake',[],age]);
    b.unshift([age===18||age===21?'Engraved keepsake key':'Engraved gift',[],age]);
  }
  if(kind==='godchild'){b.push(['Personalised godchild keepsake',[],age]);b.push(['Children’s Bible or storybook',['age'],age]);b.push(['Savings gift (cash or Premium Bonds)',[],age])}
  return b;
}
function sgList(list,pid){return list.map(function(s){return '<div class="sg"><b>'+esc(s[0])+'</b>'+linkRow(s[1],s[2])+(pid?'<button class="sm" data-a="save" data-t="'+esc(s[0])+'">＋ Save idea</button>':'')+'</div>'}).join('')}
function creaHtml(c,pid){return '<div class="sg"><b>'+esc(c[0])+'</b><p>'+esc(c[1])+'</p>'+(pid?'<button class="sm" data-a="save" data-t="'+esc(c[0])+'">＋ Save idea</button>':'')+'</div>'}
function angles(p){return ''}

/* ---------- calendar reminders ---------- */
function ymd(d){return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function gcal(title,start,recur,det){
  var end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+ymd(start)+'/'+ymd(end)+(recur?'&recur='+encodeURIComponent('RRULE:FREQ=YEARLY'):'')+'&details='+encodeURIComponent(det||'');
}
function remDate(p){var nd=nextDate(p);return new Date(nd.getFullYear(),nd.getMonth(),nd.getDate()-lead(p))}

/* ---------- fun ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var c=document.createElement('div'),e=['🎉','🎂','🎈','✨','🎁','🥳'],h='';
  for(var i=0;i<28;i++)h+='<span style="left:'+Math.random()*96+'%;animation-delay:'+Math.random()*1.2+'s">'+e[i%e.length]+'</span>';
  c.className='cf';c.innerHTML=h;document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}

/* ---------- render ---------- */
function balHtml(){
  var c=['#ffd34d','#4fc3f7','#ffffff','#81c784','#ff9ec7','#c4a1ff'],
      x=['4%','22%','40%','58%','74%','12%'],
      w=[34,40,30,38,32,28],
      t=[7,8.5,6.5,9,7.5,8],
      d=[0,.9,1.8,.4,2.6,1.3],h='';
  for(var i=0;i<6;i++)h+='<i class="b" style="--c:'+c[i]+';--x:'+x[i]+';--w:'+w[i]+'px;--t:'+t[i]+'s;--d:'+d[i]+'s"></i>';
  return '<div class="bals" aria-hidden="true">'+h+'</div>';
}
function hero(){
  var n=byDate()[0],h=document.getElementById('hero');
  if(!n){h.innerHTML=balHtml()+'<small>'+greet()+'!</small><h1>Birthdays</h1><div class="big"><span class="wig">🎂</span><div class="t"><b>No birthdays yet</b>Tap People, then + Add.</div></div>';return}
  var d=daysUntil(n),a=turning(n);
  h.innerHTML=balHtml()+'<small>'+greet()+'! Next up</small><h1>'+av(n,38)+esc(n.name)+'</h1><div class="big">'+(d===0?'<span class="wig" style="font-size:64px">🎉</span><div class="t"><b>It’s their birthday today!</b>'+(a?'Turning '+a:'')+'</div>':'<div class="num">'+d+'</div><div class="t"><b>day'+(d===1?'':'s')+' to go</b>'+fmt(nextDate(n))+(a?' · turning '+a:'')+'</div>')+'</div>';
}
function card(p){
  var d=daysUntil(p),age=turning(p);
  var gv=p.given.slice().sort((a,b)=>(b.year||0)-(a.year||0));
  return '<div class="card" style="border-left:6px solid '+COL[p.kind]+'" data-id="'+esc(p.id)+'"><div class="top"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">'+p.day+' '+MONTHS[p.month-1]+(p.year?' '+p.year:'')+(age?' · turns '+age:'')+' · '+KINDS[p.kind]+'</div></div><div class="badge'+(isDue(p)?' due':'')+'">'+(d===0?'Today!':d+' day'+(d===1?'':'s'))+'</div></div>'
  +'<div class="lbl">Interests &amp; present ideas</div>'
  +(p.ideas.map((i,k)=>'<div class="idea"><span>'+esc(i)+'</span><span><button class="sm" data-a="given" data-k="'+k+'">✓ Given</button> <button class="sm" data-a="rmidea" data-k="'+k+'">✕</button></span></div>').join('')||'<div class="meta">None yet</div>')
  +'<div class="row"><input class="ni" placeholder="Add an idea or interest"><button class="sm" data-a="addidea">Add</button></div>'
  +(gv.length?'<div class="lbl">Previous presents</div><div class="tags">'+gv.map(g=>'<span class="tag">'+esc((g.year?g.year+': ':'')+g.gift)+'</span>').join('')+'</div>':'')
  +'<div class="row"><button class="sm" data-a="edit">Edit</button><button class="sm" data-a="del">'+(delArm===p.id?'Tap again to delete':'Delete')+'</button></div></div>';
}
function ideasCard(p){
  var d=daysUntil(p),age=turning(p),last=lastGift(p);
  var h='<div class="card" style="border-left:6px solid '+COL[p.kind]+'" data-id="'+esc(p.id)+'"><div class="name">'+av(p,36)+esc(p.name)+'</div>';
  if(!age)return h+'<div class="meta">Birthday '+when(d)+'. Add their birth year for age-based ideas.</div><div class="row"><input class="ni" id="y'+esc(p.id)+'" type="number" placeholder="Birth year, e.g. 1985"><button class="sm" data-a="setyear">Set</button></div>'+ideaRows(p)+'</div>';
  h+='<div class="meta">Turns '+age+' '+when(d)+'</div>'+(last?'<div class="meta">Last present: '+esc(last)+'</div>':'');
  h+=ideaRows(p);
  return h+'<div class="lbl">Ideas for '+age+'</div>'+sgList(sugg(age,p.kind),1,aud(p))+'</div>';
}
function view(){
  var A=byDate(),v='';
  if(tab==='g'){document.getElementById('view').innerHTML=giftsView(A);return}
  if(tab==='h'){
    var due=A.filter(isDue);
    v+='<div class="bar"><button class="pri" data-a="add">＋ Add a birthday</button></div>';
    if(due.length)v+='<h2>🎁 Time to sort a present</h2>'+due.map(p=>'<div class="card" data-id="'+esc(p.id)+'"><div class="top"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">'+(daysUntil(p)===0?'Today!':'Birthday '+when(daysUntil(p)))+(lastGift(p)?' · last: '+esc(lastGift(p)):'')+'</div></div><button class="sm pri" data-a="goideas">Find ideas</button></div></div>').join('');
    if(A.length)v+='<h2>🗓️ Coming up</h2><div class="card">'+A.slice(0,5).map(p=>'<div class="mini">'+av(p,34)+'<b>'+esc(p.name)+'</b><span class="meta">'+fmt(nextDate(p))+'</span><span class="badge">'+daysUntil(p)+'d</span></div>').join('')+'</div>';
    var c=CREA[sur<0?0:sur];
    v+='<h2>✨ Surprise me</h2><div class="card spark">'+creaHtml(c)+'<div class="row"><button class="pri sm" data-a="surprise">Another idea!</button></div></div>';
  }else if(tab==='p'){
    var kinds=['all'];people.forEach(p=>{if(kinds.indexOf(p.kind)<0)kinds.push(p.kind)});
    v+='<div class="bar"><button class="pri" data-a="add">＋ Add</button><button data-a="share">Share &amp; sync</button><button data-a="contacts">Import contacts</button></div>'
    +'<div class="bar">'+kinds.map(k=>'<button class="chip'+(k===filter?' on':'')+'" data-a="filter" data-k="'+k+'">'+(k==='all'?'All':EMO[k]+' '+KINDS[k])+'</button>').join('')+'</div>'
    +(A.filter(p=>filter==='all'||p.kind===filter).map(card).join('')||'<div class="empty">No birthdays here yet 🎈</div>');
  }else if(tab==='i'&&ideaFor!=='all'&&people.some(function(x){return x.id===ideaFor})){
    var sp=people.find(function(x){return x.id===ideaFor});
    v+=chips()+ideasCard(sp)+'<h2>✨ Creative ideas for '+esc(sp.name)+'</h2><div class="card" data-id="'+esc(sp.id)+'">'+CREA.map(function(c){return creaHtml(c,1)}).join('')+'</div>';
  }else if(tab==='i'){
    v+=chips()+'<div class="card spark"><div class="name">Browse by age</div><div class="row"><input class="ni" id="bage" type="number" min="0" max="120" placeholder="Age" value="'+esc(browse.age)+'"><select id="bkind" style="width:auto">'+Object.keys(KINDS).map(k=>'<option value="'+k+'"'+(browse.kind===k?' selected':'')+'>'+KINDS[k]+'</option>').join('')+'</select><button class="sm pri" data-a="browse">Show</button></div>'
    +(browse.age!==''&&+browse.age>=0?sgList(sugg(+browse.age,browse.kind),0,audA(+browse.age,browse.kind)):'')+'</div>'
    +'<h2>✨ Creative ideas for anyone</h2><div class="card">'+CREA.map(function(c){return creaHtml(c)}).join('')+'</div>'
    +'<h2>Ideas for your people</h2>'+(A.map(ideasCard).join('')||'<div class="empty">Add someone first.</div>');
  }else{
    v+='<div class="card"><div class="name">How early should I remind you?</div><div class="meta">Your usual setting. You can change it for one person when you edit them.</div><div class="bar" style="margin-top:10px">'+[[1,'1 day'],[3,'3 days'],[7,'1 week'],[14,'2 weeks'],[30,'1 month']].map(x=>'<button class="chip'+(S.lead===x[0]?' on':'')+'" data-a="lead" data-k="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'
    +'<div class="card spark meta">This page can’t buzz your phone while it’s closed. Reminders show on the Home tab each time you open it. For real alerts, add the calendar events below to Google Calendar.</div>'
    +(A.map(p=>{var l=lead(p),rd=remDate(p),a=turning(p);
      return '<div class="card" data-id="'+esc(p.id)+'"><div class="top"><div><div class="name">'+av(p,36)+esc(p.name)+'</div><div class="meta">Birthday '+fmt(nextDate(p))+' · '+(l>0?'reminder '+(isDue(p)?'is due now':'on '+fmt(rd)):'reminders off')+'</div></div>'+(isDue(p)?'<span class="badge due">Due</span>':'')+'</div><div class="lk" style="margin-top:8px"><a href="'+gcal('🎂 '+p.name+'’s birthday'+(a?' (turns '+a+')':''),nextDate(p),1,'Birthday reminder')+'" target="_blank" rel="noopener">📅 Yearly birthday event</a>'+(l>0?'<a href="'+gcal('🎁 Sort a present for '+p.name,rd,0,'Birthday is '+fmt(nextDate(p)))+'" target="_blank" rel="noopener">⏰ Present reminder</a>':'')+'</div></div>'}).join('')||'<div class="empty">Add someone first.</div>');
  }
  document.getElementById('view').innerHTML=v;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-t')===tab));
  hero();view();
}

/* ---------- actions ---------- */
function show(id,on){document.getElementById(id).hidden=!on}
function go(t){tab=t;render();window.scrollTo(0,0)}
function openForm(p){
  editing=p?p.id:null;show('form',1);
  fname.value=p?p.name:'';fday.value=p?p.day:'';fmonth.value=p?p.month:1;fyear.value=p&&p.year?p.year:'';
  fkind.value=p?p.kind:'family';fideas.value=p?p.ideas.join('\n'):'';fremind.value=p&&p.remind!=null?p.remind:'';fphoto.value='';editPhoto=p&&p.photo||'';showPh();
  form.scrollIntoView({behavior:'smooth'});fname.focus();
}
function copy(txt){
  out.value=txt;out.select();
  try{navigator.clipboard.writeText(txt)}catch(e){try{document.execCommand('copy')}catch(_){}}
}
function asText(){return 'Birthdays\n'+byDate().map(p=>p.name+' — '+p.day+' '+MONTHS[p.month-1]+(turning(p)?' (turns '+turning(p)+')':'')+' · '+KINDS[p.kind]).join('\n')}
function merge(inc){
  var n=0;
  inc.forEach(x=>{
    x=norm(x);
    var m=people.find(p=>p.id===x.id||(p.name.toLowerCase()===x.name.toLowerCase()&&p.day===x.day&&p.month===x.month));
    if(!m){people.push(x);n++;return}
    if(!m.year&&x.year)m.year=x.year;
    if(!m.photo&&x.photo)m.photo=x.photo;
    x.ideas.forEach(i=>{if(m.ideas.indexOf(i)<0)m.ideas.push(i)});
    x.given.forEach(g=>{if(!m.given.some(h=>h.gift===g.gift&&h.year===g.year))m.given.push(g)});
  });
  return n;
}
function parseVcf(t){
  t=t.replace(/\r?\n[ \t]/g,'');
  return t.split(/BEGIN:VCARD/i).slice(1).map(c=>{
    var fn=(c.match(/^FN[^:\n]*:(.*)$/mi)||[])[1];
    if(!fn){var n=(c.match(/^N[^:\n]*:(.*)$/mi)||[])[1];if(n){var a=n.split(';');fn=((a[1]||'')+' '+(a[0]||'')).trim()}}
    var b=(c.match(/^(?:item\d+\.)?BDAY[^:\n]*:(.*)$/mi)||[])[1],bd=null,m;
    if(b){b=b.trim();
      if(m=b.match(/^(\d{4})-?(\d{2})-?(\d{2})/))bd={y:+m[1]<1900?0:+m[1],m:+m[2],d:+m[3]};
      else if(m=b.match(/^--(\d{2})-?(\d{2})/))bd={y:0,m:+m[1],d:+m[2]};}
    return fn&&fn.trim()?{name:fn.trim().replace(/\\,/g,','),bd:bd,on:!!bd}:null;
  }).filter(Boolean);
}
function renderCts(){
  ctlist.innerHTML=cts.length?'<div class="lbl">'+cts.filter(c=>c.bd).length+' of '+cts.length+' have a birthday saved</div>'+cts.map((c,i)=>'<div class="ct"><input type="checkbox" data-a="ctchk" data-i="'+i+'"'+(c.on?' checked':'')+'><span>'+esc(c.name)+'</span>'+(c.bd?'<span class="meta" style="flex:none">'+c.bd.d+' '+MONTHS[c.bd.m-1]+(c.bd.y?' '+c.bd.y:'')+'</span>':'<input type="date" data-a="ctdate" data-i="'+i+'" title="Add a birthday">')+'</div>').join(''):'<div class="meta">No contacts found in that file.</div>';
  show('ctact',cts.length);
}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=160,c=document.createElement('canvas');c.width=c.height=s;var m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',.8))};im.onerror=function(){cb('')};im.src=r.result};r.readAsDataURL(file)}
function showPh(){document.getElementById('phprev').innerHTML=editPhoto?'<img class="av" style="width:56px;height:56px" src="'+editPhoto+'" alt="">':''}
fphoto.onchange=function(){var f=fphoto.files[0];if(f)shrink(f,function(u){if(u){editPhoto=u;showPh()}})};
vcf.onchange=function(){
  var f=vcf.files[0];if(!f)return;
  var r=new FileReader();r.onload=()=>{cts=parseVcf(String(r.result));renderCts()};r.readAsText(f);
};
form.onsubmit=function(e){
  e.preventDefault();
  var o={name:fname.value.trim(),day:+fday.value,month:+fmonth.value,year:+fyear.value||0,kind:fkind.value,remind:fremind.value===''?null:+fremind.value,photo:editPhoto,ideas:fideas.value.split('\n').map(s=>s.trim()).filter(Boolean)};
  if(!o.name||o.day<1||o.day>31)return;
  if(editing){Object.assign(people.find(x=>x.id===editing),o)}
  else{o.id=Math.random().toString(36).slice(2,14);o.given=[];people.push(o)}
  save();show('form',0);render();
};
document.addEventListener('change',function(e){
  var a=e.target.getAttribute('data-a'),i=e.target.getAttribute('data-i');
  if(a==='ctchk')cts[i].on=e.target.checked;
  if(a==='ctdate'&&e.target.value){var m=e.target.value.split('-');cts[i].bd={y:+m[0],m:+m[1],d:+m[2]};cts[i].on=true;renderCts()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList.contains('ni')){var b=e.target.parentNode.querySelector('button');if(b)b.click()}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;
  var a=t.getAttribute('data-a'),k=t.getAttribute('data-k'),cd=t.closest('[data-id]'),p=cd&&people.find(x=>x.id===cd.getAttribute('data-id'));
  if(a!=='del')delArm=null;
  if(a==='add'){if(tab!=='p')go('p');openForm(null)}
  else if(a==='cancel')show('form',0);
  else if(a==='share'){show('sharebox',sharebox.hidden);show('ctbox',0)}
  else if(a==='contacts'){show('ctbox',ctbox.hidden);show('sharebox',0)}
  else if(a==='tab')go(t.getAttribute('data-t'));
  else if(a==='goideas'){ideaFor=p?p.id:'all';go('i')}
  else if(a==='ideafor'){ideaFor=k;render()}
  else if(a==='addgift'){var q=people.find(x=>x.id===document.getElementById('gp').value),gt=document.getElementById('gt').value.trim();if(q&&gt){q.given.push({year:+document.getElementById('gy').value||0,gift:gt});save();render()}}
  else if(a==='rmgift'){p.given.splice(+k,1);save();render()}
  else if(a==='rmphoto'){editPhoto='';showPh();fphoto.value=''}
  else if(a==='filter'){filter=k;render()}
  else if(a==='lead'){S.lead=+k;saveS();render()}
  else if(a==='surprise'){sur=(sur+1+Math.floor(Math.random()*(CREA.length-1)))%CREA.length;render();confetti()}
  else if(a==='edit')openForm(p);
  else if(a==='del'){if(delArm===p.id){people=people.filter(x=>x!==p);delArm=null;save()}else delArm=p.id;render()}
  else if(a==='addidea'){var v=cd.querySelector('.ni').value.trim();if(v&&p.ideas.indexOf(v)<0){p.ideas.push(v);save()}render()}
  else if(a==='rmidea'){p.ideas.splice(+k,1);save();render()}
  else if(a==='given'){var g=p.ideas.splice(+k,1)[0];p.given.push({year:new Date().getFullYear(),gift:g});save();render();confetti()}
  else if(a==='save'){var s=t.getAttribute('data-t');if(p.ideas.indexOf(s)<0)p.ideas.push(s);save();t.textContent='✓ Saved';t.disabled=true}
  else if(a==='setyear'){var y=+cd.querySelector('input').value;if(y>1900&&y<2100){p.year=y;save();render()}}
  else if(a==='browse'){browse.age=document.getElementById('bage').value;browse.kind=document.getElementById('bkind').value;render()}
  else if(a==='copytext')copy(asText());
  else if(a==='copycode')copy(encode(people));
  else if(a==='merge'){try{var n=merge(decode(impcode.value));save();render();impmsg.textContent='Merged. '+n+' new '+(n===1?'person':'people')+' added.'}catch(x){impmsg.textContent='That code doesn’t look right.'}}
  else if(a==='ctadd'){
    var n=0;
    cts.forEach(c=>{if(c.on&&c.bd&&!people.some(q=>q.name.toLowerCase()===c.name.toLowerCase()&&q.day===c.bd.d&&q.month===c.bd.m)){people.push({id:Math.random().toString(36).slice(2,14),name:c.name,day:c.bd.d,month:c.bd.m,year:c.bd.y,kind:ctkind.value,ideas:[],given:[],remind:null});n++}});
    save();render();ctmsg.textContent=n+' added.';
  }
});
fmonth.innerHTML=MONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
var ko=Object.keys(KINDS).map(k=>'<option value="'+k+'">'+KINDS[k]+'</option>').join('');
fkind.innerHTML=ko;ctkind.innerHTML=ko;ctkind.value='friend';
people=load();loadS();sur=Math.floor(Math.random()*CREA.length);render();
if(people.some(p=>daysUntil(p)===0))setTimeout(confetti,500);
</script>
</body>
